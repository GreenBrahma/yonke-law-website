[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Redirects — old /how-it-works → new /people-first
[[redirects]]
  from = "/how-it-works"
  to = "/people-first"
  status = 301

[[redirects]]
  from = "/how-it-works/*"
  to = "/people-first/:splat"
  status = 301

# Redirect retired /people-first/people-portal → /people-first
[[redirects]]
  from = "/people-first/people-portal"
  to = "/people-first"
  status = 301
